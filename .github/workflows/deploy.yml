name: Deploy to Hostinger

# Every push to main updates the live site. Nothing here touches the database
# contents: menu:import is deliberately NOT run, because it would overwrite
# prices and names edited in the admin with the values from the JSON file.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and migrate on the server
    runs-on: ubuntu-latest

    steps:
      # Until the repository secrets are filled in, every push would otherwise
      # fail with "missing server host", which says nothing useful. Check first
      # and explain instead.
      - name: Check deployment secrets
        id: preflight
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY DEPLOY_PATH; do
            [ -z "${!name}" ] && missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment is not configured yet"
              echo
              echo "Missing repository secrets:**$missing**"
              echo
              echo "Add them under **Settings → Secrets and variables → Actions**."
              echo "The README section *Deploying to Hostinger* lists every value."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Skipping deploy — missing secrets:$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.preflight.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script_stop: true
          script: |
            set -e

            # Hostinger's default `php` can be an older build; PHP_BIN lets you
            # pin the right one, e.g. /usr/bin/php8.2
            PHP="${{ secrets.PHP_BIN || 'php' }}"
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "→ fetching origin/main"
            git fetch --all --prune
            git reset --hard origin/main

            echo "→ installing dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            echo "→ migrating"
            $PHP artisan migrate --force

            echo "→ refreshing caches"
            $PHP artisan optimize:clear
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache

            echo "→ done"
            $PHP artisan --version
